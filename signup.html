<!DOCTYPE html>
<html>
<head>
<title>Sign Up - MarketNova</title>
<style>
body{
background:#050816;
font-family:Arial,sans-serif;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}
.box{
background:#111827;
padding:30px;
border-radius:15px;
width:300px;
}
input{
width:100%;
padding:10px;
margin:10px 0;
border:none;
border-radius:8px;
}
button{
width:100%;
padding:12px;
background:#00ff99;
border:none;
border-radius:8px;

}
</style>
</head>
<body>
<div class="box">
<h2>Sign Up</h2>
<input type="text" placeholder="Username">
<input type="email" placeholder="Email">
<input type="password" placeholder="Password">
<button onclick="window.location.href='login.html'">
Create Account
</button>
</div>
</body>
</html>
